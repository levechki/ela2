<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Новогодняя открытка 2027</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            background: #0a1f1a;
            overflow: hidden;
            position: relative;
        }

        /* Динамический фон */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #1e3a2e, #0a1f1a 70%);
            z-index: 0;
            animation: breathe 8s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* Снежинки */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            user-select: none;
            animation: fall linear infinite;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
        }

        /* Основная карточка */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: rgba(22, 45, 38, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(212, 175, 55, 0.3), 0 0 30px rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.4);
            text-align: center;
            transition: all 0.3s ease;
        }

        .decor-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 1.6rem;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
        }

        .decor-row span {
            animation: float 3s infinite ease-in-out;
        }

        .decor-row span:nth-child(2) { animation-delay: 0.3s; }
        .decor-row span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h1 {
            font-size: 1.6rem;
            color: #ffd966;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
        }

        .subhead {
            color: #c0d6c0;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            font-style: italic;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.4);
            padding-bottom: 0.8rem;
        }

        /* Поле ввода */
        .input-group {
            margin: 1.5rem 0 1rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #e0e0b0;
            font-size: 0.85rem;
            margin-bottom: 6px;
            padding-left: 8px;
        }

        .input-group input {width: 100%;
            padding: 14px 18px;
            border-radius: 60px;
            border: 2px solid rgba(212, 175, 55, 0.5);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        .input-group input::placeholder {
            color: #888;
            font-style: italic;
        }

        .input-group input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Кнопка */
        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #b8860b, #d4af37, #ffd966);
            color: #1a2e24;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e0a, 0 12px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
            margin-top: 0.8rem;
            font-family: inherit;
            text-transform: uppercase;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #6b4e0a, 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        /* Блок поздравления */
        .greeting-box {
            display: none;
            margin-top: 1rem;
            padding-top: 0.5rem;
            animation: fadeSlide 0.6s ease forwards;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .name-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffd966;
            margin-bottom: 0.6rem;
            word-break: break-word;
            text-shadow: 0 0 25px rgba(255, 200, 0, 0.8);
            line-height: 1.3;
        }

        .greeting-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f0f0e0;
            padding: 0.3rem 0.2rem;
            font-weight: 400;
        }

        .emoji-footer {
            margin-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 1.6rem;
            opacity: 0.9;
        }

        .emoji-footer span {
            filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.4));
        }

        .year-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 0.8rem;
            color: #e6d5a8;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* ===== АНИМАЦИЯ С КОЗАМИ ===== */
        .goat-scene {
            position: relative;
            height: 90px;
            margin: 0.5rem 0 0.5rem;
            overflow: hidden;
            display: none;
        }

        .goat {
            position: absolute;
            font-size: 2.4rem;
            bottom: 0;
            animation: goatJump 1.2s infinite ease-in-out;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            will-change: transform;
        }

        @keyframes goatJump {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            30% { transform: translateY(-30px) scale(1.1) rotate(-6deg); }
            60% { transform: translateY(-12px) scale(1.05) rotate(4deg); }
        }

        /* Козочки бегут по кругу/сцене */
        .goat-1 { left: 5%; animation-delay: 0s; }
        .goat-2 { left: 28%; animation-delay: 0.25s; }
        .goat-3 { left: 52%; animation-delay: 0.5s; }
        .goat-4 { left: 76%; animation-delay: 0.75s; }

        /* Маленькие козочки скачут иначе */
        .goat-small {font-size: 1.8rem;
            animation: goatJumpSmall 1s infinite ease-in-out;
        }

        @keyframes goatJumpSmall {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-18px) scale(1.15); }
        }

        /* Снежная пыль под козами */
        .goat-snow {
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 20px;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* Плавное появление сцены с козами */
        .goat-scene.visible {
            display: block;
            animation: goatsFadeIn 0.8s ease forwards;
        }

        @keyframes goatsFadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Дополнительный декор — ёлочка в углу */
        .corner-tree {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 3rem;
            opacity: 0.3;
            z-index: 2;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
        }

        @media (max-width: 380px) {
            .card { padding: 1.5rem 1rem; }
            h1 { font-size: 1.3rem; }
            .name-display { font-size: 1.5rem; }
            .greeting-text { font-size: 1rem; }
            .goat-scene { height: 75px; }
            .goat { font-size: 2rem; }
            .goat-small { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Динамический фон -->
    <div class="bg-gradient"></div>
    <div class="snow" id="snowContainer"></div>
    <div class="corner-tree">🎄</div>

    <!-- Карточка -->
    <div class="card">
        <div class="decor-row">
            <span>🎄</span>
            <span>❄️</span>
            <span>🎁</span>
        </div>
        <div class="year-badge">2027 · Огненная Коза 🐐🔥</div>
        <h1>С Новым годом!</h1>
        <div class="subhead">Дедушка Мороз и Снегурочка ждут тебя</div>

        <!-- Форма ввода -->
        <div class="input-group" id="inputGroup">
            <label for="nameInput">Как к тебе обращаться?</label>
            <input type="text" id="nameInput" placeholder="Например: Сашенька, Мама, Друг..." maxlength="30" autocomplete="off">
        </div>

        <button class="btn" id="getCardBtn">Получить открытку</button>

        <!-- Анимация с козами + поздравление -->
        <div class="greeting-box" id="greetingBox">
            <!-- Сцена с козами -->
            <div class="goat-scene" id="goatScene">
                <div class="goat-snow"></div>
                <span class="goat goat-1">🐐</span>
                <span class="goat goat-2 goat-small">🐐</span>
                <span class="goat goat-3">🐐</span>
                <span class="goat goat-4 goat-small">🐐</span>
            </div>
            <div class="name-display" id="nameDisplay"></div>
            <div class="greeting-text" id="greetingText"></div>
            <div class="emoji-footer">
                <span>🎅</span>
                <span>❄️</span>
                <span>🐐</span>
                <span>🎄</span>
                <span>⛄</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ===== 1. Генерация снежинок =====
            const snowContainer = document.getElementById('snowContainer');
            const snowflakeCount = 60;
            const snowChars = ['❄️', '❅', '❆', '·', '✧', '•', '❄', '✻'];

            for (let i = 0; i < snowflakeCount; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
                const size = Math.random() * 1.4 + 0.6;flake.style.fontSize = size + 'rem';
                flake.style.left = Math.random() * 100 + '%';
                flake.style.animationDuration = (Math.random() * 8 + 6) + 's';
                flake.style.animationDelay = (Math.random() * 10) + 's';
                flake.style.opacity = Math.random() * 0.6 + 0.3;
                snowContainer.appendChild(flake);
            }

            // ===== 2. Логика открытки =====
            const nameInput = document.getElementById('nameInput');
            const getCardBtn = document.getElementById('getCardBtn');
            const greetingBox = document.getElementById('greetingBox');
            const nameDisplay = document.getElementById('nameDisplay');
            const greetingText = document.getElementById('greetingText');
            const inputGroup = document.getElementById('inputGroup');
            const goatScene = document.getElementById('goatScene');

            // Пожелания (2-3 строки)
            const wishes = [
                'Пусть Огненная Коза принесёт тепло в дом, а снежные искры закружат в танце удачи. Счастья, мира и волшебства!',
                'В год Козы желаю мягкого света свечей, крепкого здоровья и чтобы каждый день был согрет заботой близких.',
                'Пусть Дедушка Мороз положит под ёлку самое заветное, а Снегурочка укроет от всех невзгод. Будь счастлив(а)!',
                'Огненная Коза уже стучится в дверь — открой ей навстречу удачу, любовь и вдохновение. С Новым годом!',
                'Пусть еловые ветки пахнут детством, а мандарины — радостью. Желаю мира, добра и исполнения желаний в 2027-м!',
                'Снег кружится, год спешит — пусть он будет щедрым на улыбки, тёплые встречи и уютные вечера.',
                'Коза — символ заботы и гармонии. Пусть этот год принесёт тебе спокойствие, творческое вдохновение и крепкое здоровье!',
                'Загадай желание под бой курантов — Огненная Коза поможет его исполнить. Счастья, света и волшебства!'
            ];

            // Показать открытку
            function showGreeting() {
                let name = nameInput.value.trim();
                if (name === '') {
                    name = 'Друг';
                }

                // Имя в поздравлении
                nameDisplay.textContent = name + '!';

                // Случайное пожелание
                const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
                greetingText.textContent = randomWish;

                // Скрываем форму
                inputGroup.style.display = 'none';
                getCardBtn.style.display = 'none';

                // Показываем поздравление + сцену с козами
                greetingBox.style.display = 'block';
                goatScene.classList.add('visible');

                // Перезапуск анимации появления
                greetingBox.style.animation = 'none';
                void greetingBox.offsetWidth;
                greetingBox.style.animation = 'fadeSlide 0.6s ease forwards';

                // Перезапуск прыжков коз (чтобы анимация стартовала с начала)
                const goats = goatScene.querySelectorAll('.goat');
                goats.forEach(goat => {
                    goat.style.animation = 'none';
                    void goat.offsetWidth;
                    // Возвращаем класс анимации в зависимости от размера
                    if (goat.classList.contains('goat-small')) {
                        goat.style.animation = 'goatJumpSmall 1s infinite ease-in-out';
                    } else {
                        goat.style.animation = 'goatJump 1.2s infinite ease-in-out';
                    }
                });
            }

            getCardBtn.addEventListener('click', showGreeting);

            nameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    showGreeting();
                }
            });
        })();</script>
</body>
</html>
